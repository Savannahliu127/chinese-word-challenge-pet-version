<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐾 900 詞語認讀：奇幻寵物養成大師 (iPad 9 極速響應版)</title>
  <!-- 💡 拼音庫 + 🎉 煙花粒子動畫庫 -->
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
    
    body {
      background: radial-gradient(circle at center, #2e1065 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 15px;
      color: #ffffff;
      overflow-x: hidden;
      transition: background 0.8s ease;
    }

    /* 🐾 溫馨萌寵玻璃卡片容器 */
    .card-container {
      background: rgba(255, 255, 255, 0.12);
      border: 3px solid #f472b6;
      backdrop-filter: blur(20px);
      width: 95%;
      max-width: 580px;
      padding: 30px 22px 26px 22px;
      border-radius: 40px 50px 35px 45px / 45px 35px 50px 40px;
      box-shadow: 0 0 35px rgba(244, 114, 182, 0.35), inset 0 0 15px rgba(255, 255, 255, 0.2);
      text-align: center;
      position: relative;
      transition: all 0.3s ease;
    }

    .card-container::before {
      content: '🐾';
      position: absolute;
      top: -28px;
      left: 25px;
      font-size: 34px;
      filter: drop-shadow(0 0 8px #f472b6);
      transform: rotate(-15deg);
    }
    .card-container::after {
      content: '🐾';
      position: absolute;
      top: -28px;
      right: 25px;
      font-size: 34px;
      filter: drop-shadow(0 0 8px #f472b6);
      transform: rotate(15deg) scaleX(-1);
    }

    .badges-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 10px;
    }
    .count-badge {
      background: linear-gradient(135deg, #fb7185, #f43f5e);
      color: #ffffff;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 15px;
      box-shadow: 0 0 10px rgba(244, 63, 94, 0.4);
    }
    .combo-badge {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: #ffffff;
      font-weight: bold;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 15px;
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }
    .high-score-badge {
      background: #fef08a;
      color: #713f12;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
    }
    .stage-badge {
      background: rgba(255, 255, 255, 0.2);
      color: #fef08a;
      font-weight: bold;
      padding: 4px 14px;
      border-radius: 14px;
      font-size: 13px;
      margin-bottom: 8px;
      display: inline-block;
      border: 1px solid rgba(254, 240, 138, 0.4);
    }
    
    .header-ctrls {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .mode-btn {
      background: rgba(244, 114, 182, 0.2);
      color: #fbcfe8;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #f472b6;
      transition: all 0.2s ease;
    }
    .mode-btn.active {
      background: #f472b6;
      color: #831843;
      box-shadow: 0 0 12px rgba(244, 114, 182, 0.6);
    }
    .bgm-btn {
      background: rgba(250, 204, 21, 0.2);
      color: #fde047;
      font-weight: bold;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #fde047;
      transition: all 0.2s ease;
    }
    .bgm-btn.active {
      background: #fde047;
      color: #713f12;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.6);
    }

    .pet-stage {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 18px;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .pet-name {
      font-size: 18px;
      font-weight: bold;
      color: #fef08a;
      margin-bottom: 6px;
    }
    .pet-exp-bar {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      height: 16px;
      width: 100%;
      overflow: hidden;
      border: 1px solid #f472b6;
    }
    .pet-exp-fill {
      background: linear-gradient(90deg, #f472b6, #fb7185, #f59e0b);
      height: 100%;
      width: 100%;
      transition: width 0.3s ease;
    }

    .flashcard {
      background: rgba(15, 23, 42, 0.75);
      border: 3px solid #f472b6;
      border-radius: 30px;
      height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 0 18px 0;
      position: relative;
      transition: all 0.2s ease;
      box-shadow: 0 0 25px rgba(244, 114, 182, 0.3);
    }
    .flashcard.correct {
      border-color: #34d399;
      background: rgba(52, 211, 153, 0.2);
      box-shadow: 0 0 35px rgba(52, 211, 153, 0.6);
    }
    .flashcard.correct .pet-avatar {
      animation: petJump 0.35s ease-in-out;
    }
    .flashcard.critical {
      border-color: #f59e0b;
      background: rgba(245, 158, 11, 0.25);
      box-shadow: 0 0 45px rgba(245, 158, 11, 0.8);
    }
    .flashcard.critical .pet-avatar {
      animation: petJumpCrit 0.45s ease-in-out;
    }
    .flashcard.wrong {
      border-color: #fb7185;
      background: rgba(251, 113, 133, 0.2);
    }

    @keyframes petJump {
      0% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-18px) scale(1.15); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes petJumpCrit {
      0% { transform: translateY(0) scale(1) rotate(0deg); }
      30% { transform: translateY(-25px) scale(1.25) rotate(-10deg); }
      70% { transform: translateY(-25px) scale(1.25) rotate(10deg); }
      100% { transform: translateY(0) scale(1) rotate(0deg); }
    }

    .pet-avatar { font-size: 54px; line-height: 1; margin-bottom: 4px; transition: all 0.3s ease; }
    .pet-avatar.ultimate-avatar { font-size: 72px; filter: drop-shadow(0 0 12px #f59e0b); }

    .word {
      font-size: 58px;
      font-weight: bold;
      color: #ffffff;
      letter-spacing: 3px;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
      transition: font-size 0.3s ease;
    }

    .status-text {
      font-size: 18px;
      min-height: 28px;
      color: #fbcfe8;
      margin-bottom: 18px;
      font-weight: bold;
    }

    .crit-popup {
      position: absolute;
      top: -15px;
      font-size: 26px;
      font-weight: 900;
      color: #fef08a;
      text-shadow: 0 0 10px #f59e0b, 0 0 20px #ef4444;
      animation: floatUp 0.6s ease-out forwards;
      pointer-events: none;
    }
    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(10px) scale(0.8); }
      50% { opacity: 1; transform: translateY(-15px) scale(1.2); }
      100% { opacity: 0; transform: translateY(-30px) scale(1); }
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
    }

    .btn {
      font-size: 18px;
      font-weight: bold;
      padding: 12px 28px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      color: #ffffff;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.5);
      transition: transform 0.1s, box-shadow 0.3s;
    }
    .btn:active { transform: scale(0.95); }
    .btn-success { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }
    .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 0 20px rgba(245, 158, 11, 0.5); }
    .btn-danger { background: linear-gradient(135deg, #f43f5e, #be123c); box-shadow: 0 0 20px rgba(244, 63, 94, 0.5); }
    .btn-secondary { background: rgba(255, 255, 255, 0.2); color: #fff; box-shadow: none; font-size: 15px; padding: 8px 18px; }

    @media (orientation: landscape) and (min-width: 768px) {
      body { padding: 10px; }
      .card-container { max-width: 820px; padding: 32px 36px; }
      .flashcard { height: 230px; }
      .word { font-size: 78px; }
      .pet-avatar { font-size: 64px; }
      .pet-avatar.ultimate-avatar { font-size: 82px; }
      .pet-name { font-size: 20px; }
      .status-text { font-size: 20px; }
      .btn { font-size: 20px; padding: 14px 36px; }
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: #1e1b4b;
      border: 2px solid #f472b6;
      border-radius: 28px;
      padding: 26px;
      max-width: 500px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 40px rgba(244, 114, 182, 0.4);
      color: #fff;
    }

    .learn-card {
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed #f59e0b;
      border-radius: 18px;
      padding: 16px;
      margin: 16px 0;
    }
    .learn-word { font-size: 34px; font-weight: bold; color: #f43f5e; }
    .learn-pinyin { font-size: 26px; font-weight: bold; color: #f59e0b; margin-top: 4px; }

    .wrong-words-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-height: 180px;
      overflow-y: auto;
      margin-top: 10px;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 14px;
    }
    .wrong-tag {
      background: rgba(244, 63, 94, 0.2);
      border: 1px solid #f43f5e;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 15px;
      color: #fda4af;
    }
  </style>
</head>
<body>

  <div class="card-container" id="main-card">
    <div class="badges-row">
      <div class="count-badge" id="count-display">🍎 餵養果實：0 個</div>
      <div class="combo-badge" id="combo-display">❤️ COMBO x0</div>
      <div class="high-score-badge" id="high-score-display">🏆 最高：0</div>
    </div>

    <div class="stage-badge" id="stage-display">🗺️ 小屋：🌸 馬卡龍櫻花森林</div>

    <div class="header-ctrls">
      <div class="mode-btn active" id="btn-mode-seq" onclick="selectMode('sequential')">➡️ 順序養成</div>
      <div class="mode-btn" id="btn-mode-rand" onclick="selectMode('random')">🔀 隨機探索</div>
      <div class="bgm-btn" id="bgm-btn" onclick="toggleBGM()">🔇 BGM: OFF</div>
    </div>

    <div class="pet-stage">
      <div class="pet-name" id="pet-name">🥚 神秘寵物蛋 (1/5 破殼)</div>
      <div class="pet-exp-bar">
        <div class="pet-exp-fill" id="exp-fill"></div>
      </div>
    </div>

    <div class="flashcard" id="flashcard">
      <div id="crit-box"></div>
      <div class="pet-avatar" id="pet-avatar">🥚</div>
      <div class="word" id="word-display">點擊開始餵養</div>
    </div>

    <div class="status-text" id="status-text">點擊按鈕念出詞語餵養小寵物</div>

    <div class="btn-group">
      <button class="btn" id="start-btn" onclick="startNewGame()">🐾 開始餵養寵物</button>
      <button class="btn btn-warning" id="resume-btn" onclick="loadSavedProgress()" style="display:none;">📂 繼續上次進度</button>
    </div>
    <br>
    <button class="btn btn-secondary" id="skip-btn" onclick="skipWord()" style="display:none; margin-top:10px;">跳過此詞</button>

    <div class="result-box" id="result-box" style="display:none; margin-top:20px;">
      <div id="result-title" style="font-size:24px; font-weight:bold; color:#f472b6; margin-bottom:10px;">🎯 萌寵養成成果日誌</div>
      <div id="result-info" style="font-size:17px; color:#cbd5e0; line-height:1.6;"></div>
    </div>
  </div>

  <div class="modal-overlay" id="fail-modal">
    <div class="modal-content">
      <div style="font-size: 22px; font-weight: bold; color: #f472b6; margin-bottom: 10px;">🥺 小寵物歪頭困惑</div>
      <div style="font-size: 15px; color: #a0aec0; margin-bottom: 10px;">「小寵物還聽不懂這個詞語魔法，請教教牠怎麼讀吧！」</div>
      <div class="learn-card">
        <div style="font-size: 14px; color: #a0aec0;">正確的詞語發音是：</div>
        <div class="learn-word" id="modal-word">晴朗</div>
        <div class="learn-pinyin" id="modal-pinyin">[ qíng lǎng ]</div>
      </div>
      <div style="font-size: 15px; color: #a0aec0; margin-bottom: 15px;" id="modal-heard"></div>
      
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <button class="btn btn-success" onclick="choiceContinue()">✨ 再教一次 (重試此詞)</button>
        <button class="btn btn-warning" onclick="choiceRestart()">🔄 重新開始 (從頭開始)</button>
        <button class="btn btn-danger" onclick="choiceEnd()">🏁 回家休息 (查看成果)</button>
      </div>
    </div>
  </div>

    let activeWordList = [...rawWordList];

    let currentIndex = 0;

    let bgmInterval = null;
    let isBgmOn = false;

    function selectMode(mode) {
      currentMode = mode;
      document.getElementById('btn-mode-seq').className = mode === 'sequential' ? "mode-btn active" : "mode-btn";
      document.getElementById('btn-mode-rand').className = mode === 'random' ? "mode-btn active" : "mode-btn";
    }

    function toggleBGM() {
      isBgmOn = !isBgmOn;
      const btn = document.getElementById('bgm-btn');
      if (isBgmOn) {
        btn.innerText = "🎵 BGM: ON";
        btn.classList.add('active');
        startBGMLoop();
      } else {
        btn.innerText = "🔇 BGM: OFF";
        btn.classList.remove('active');
        stopBGMLoop();
      }
    }

    function startBGMLoop() {
      if (bgmInterval) clearInterval(bgmInterval);
      const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 349.23, 440.00, 523.25, 440.00, 349.23];
      let step = 0;
      bgmInterval = setInterval(() => {
        if (!isBgmOn) return;
        try {
          const ctx = audioContext || new (window.AudioContext || window.webkitAudioContext)();
          if (ctx.state === 'suspended') ctx.resume();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(notes[step % notes.length], ctx.currentTime);
          gain.gain.setValueAtTime(0.04, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.22);
          step++;
        } catch(e){}
      }, 300);
    }

    function stopBGMLoop() {
      if (bgmInterval) clearInterval(bgmInterval);
    }

    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function loadHighScore() {
      const savedScore = localStorage.getItem('vocab_challenge_max') || 0;
      document.getElementById('high-score-display').innerText = `🏆 最高：${savedScore}`;
      checkSavedProgressBtn();
      return parseInt(savedScore);
    }

    function checkSavedProgressBtn() {
      const savedIdx = parseInt(localStorage.getItem('vocab_saved_index') || '0');
      const resumeBtn = document.getElementById('resume-btn');
      if (savedIdx > 0 && savedIdx < rawWordList.length && !isChallenging) {
        resumeBtn.innerText = `📂 繼續第 ${savedIdx + 1} 關`;
        resumeBtn.style.display = 'inline-block';
      } else {
        resumeBtn.style.display = 'none';
      }
    }

    function saveProgress() {
      localStorage.setItem('vocab_saved_index', currentIndex);
      localStorage.setItem('vocab_saved_mode', currentMode);
      localStorage.setItem('vocab_saved_list', JSON.stringify(activeWordList));
    }

    function updateCard() {
      if (currentIndex >= activeWordList.length) {
        endChallenge(true);
        return;
      }

      const petState = getPetState(currentIndex);

      // 切換主題家園背景
      const stageTheme = stageThemes[petState.themeIdx];
      document.body.style.background = stageTheme.bg;
      document.getElementById('main-card').style.borderColor = stageTheme.themeColor;
      document.getElementById('stage-display').innerText = `🗺️ 小屋：${stageTheme.name}`;

      document.getElementById('pet-name').innerText = petState.stageName;
      
      const avatarElem = document.getElementById('pet-avatar');
      avatarElem.innerText = petState.avatar;

      const expFill = document.getElementById('exp-fill');
      const flashcard = document.getElementById('flashcard');

      if (petState.isUltimate) {
        avatarElem.className = "pet-avatar ultimate-avatar";
        flashcard.className = "flashcard critical";
      } else {
        avatarElem.className = "pet-avatar";
        flashcard.className = "flashcard";
      }
      
      const pct = Math.round((petState.stepInPet / 30) * 100);
      expFill.style.width = `${pct}%`;

      document.getElementById('count-display').innerText = `🍎 餵養果實：${currentIndex} 個`;
      document.getElementById('combo-display').innerText = `❤️ COMBO x${comboCount}`;
      
      document.getElementById('word-display').innerText = activeWordList[currentIndex];
      saveProgress();
    }

    function startNewGame() {
      if (currentMode === 'random') {
        activeWordList = shuffleArray(rawWordList);
      } else {
        activeWordList = [...rawWordList];
      }
      currentIndex = 0;
      comboCount = 0;
      maxCombo = 0;
      sessionWrongWords.clear();
      startChallengeProcess();
    }

    function loadSavedProgress() {
      currentIndex = parseInt(localStorage.getItem('vocab_saved_index') || '0');
      currentMode = localStorage.getItem('vocab_saved_mode') || 'sequential';
      selectMode(currentMode);

      const savedList = localStorage.getItem('vocab_saved_list');
      if (savedList) {
        try { activeWordList = JSON.parse(savedList); } catch(e) { activeWordList = [...rawWordList]; }
      }
      startChallengeProcess();
    }

    function handleClickStart() {
      if (isChallenging) {
        stopChallenge();
      } else {
        startNewGame();
      }
    }

    function startChallengeProcess() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert("您的瀏覽器不支援原生語音辨識，請務必使用 iPad Safari 瀏覽器開啓此網頁！");
        return;
      }

      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      if (audioContext.state === 'suspended') audioContext.resume();

      if (isBgmOn) startBGMLoop();

      isChallenging = true;
      document.getElementById('result-box').style.display = 'none';
      document.getElementById('start-btn').innerText = '回家休息/暫停';
      document.getElementById('start-btn').className = 'btn btn-danger';
      document.getElementById('resume-btn').style.display = 'none';
      document.getElementById('skip-btn').style.display = 'inline-block';
      
      updateCard();
      initSpeechRecognition();
    }

    function stopChallenge() {
      isChallenging = false;
      stopBGMLoop();
      if (recognition) {
        recognition.onresult = null;
        recognition.onerror = null;
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }
      document.getElementById('start-btn').innerText = '🐾 開始餵養寵物';
      document.getElementById('start-btn').className = 'btn';
      document.getElementById('skip-btn').style.display = 'none';
      document.getElementById('status-text').innerText = '小寵物正在安靜休息中';
      checkSavedProgressBtn();
    }

    // ⚡ 核心：實時串流語音辨識 (interimResults = true，極速攔截不等待靜音)
    function initSpeechRecognition() {
      if (!isChallenging) return;

      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'zh-CN';
      recognition.continuous = true;
      recognition.interimResults = true; // ⚡ 開啟中間實時結果，解決 iPad 9 響應慢

      const targetWord = activeWordList[currentIndex].replace(/[…\.]/g, '');
      const petState = getPetState(currentIndex);
      
      if (petState.isUltimate) {
        document.getElementById('status-text').innerText = `👑 終極神獸對頻！請吟唱【${targetWord}】！`;
      } else {
        document.getElementById('status-text').innerText = `🎤 請念出詞語【${targetWord}】餵養小寵物！`;
      }

      recognition.onresult = (event) => {
        if (!isChallenging) return;

        // 遍歷所有實時中間結果，只要匹配立刻觸發，不用死等 Siri 判定說話結束
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const heardText = event.results[i][0].transcript.trim();
          console.log(`實時聽到的語音：[${heardText}]，目標詞語：[${targetWord}]`);

          if (checkMatch(heardText, targetWord)) {
            handleSuccess();
            return;
          }
        }
      };

      recognition.onerror = (event) => {
        console.warn("語音辨識提示:", event.error);
        if (event.error === 'no-speech' && isChallenging) {
          restartListening();
        }
      };

      recognition.onend = () => {
        if (isChallenging) {
          restartListening();
        }
      };

      try {
        recognition.start();
      } catch(e) {}
    }

    function restartListening() {
      if (!isChallenging) return;
      try {
        recognition.start();
      } catch(e) {}
    }

    function getStandardPinyin(word) {
      if (customPinyinDict[word]) return customPinyinDict[word];
      if (typeof pinyinPro !== 'undefined' && pinyinPro.pinyin) {
        try {
          return pinyinPro.pinyin(word, { toneType: 'symbol', type: 'string' });
        } catch(e) {}
      }
      return '';
    }

    function getPinyinSyllableArray(word) {
      const cleanWord = word.replace(/[^\u4e00-\u9fa5a-zA-Z]/g, '');
      if (customPinyinArrayDict[cleanWord]) {
        return customPinyinArrayDict[cleanWord];
      }
      if (typeof pinyinPro !== 'undefined' && pinyinPro.pinyin) {
        try {
          return pinyinPro.pinyin(cleanWord || word, { toneType: 'none', type: 'array' });
        } catch(e) {}
      }
      return [];
    }

    function normalizeSyllable(s) {
      if (!s) return '';
      let py = s.toLowerCase().replace(/[^a-z]/g, '');
      if (py === 'lu') py = 'lv';
      if (py === 'nu') py = 'nv';

      if (py.startsWith('n')) py = 'l' + py.slice(1);
      if (py.startsWith('zh')) py = 'z' + py.slice(2);
      else if (py.startsWith('ch')) py = 'c' + py.slice(2);
      else if (py.startsWith('sh')) py = 's' + py.slice(2);

      if (py.endsWith('ing')) py = py.slice(0, -3) + 'in';
      else if (py.endsWith('eng')) py = py.slice(0, -3) + 'en';
      else if (py.endsWith('ang')) py = py.slice(0, -3) + 'an';

      return py;
    }

    // 💡 逐字音節嚴格匹配引擎 (排除「難過/難得」、「綠色/黃色」等誤判)
    function checkMatch(heard, target) {
      if (!heard || !target) return false;
      
      const cleanHeard = heard.replace(/[^\u4e00-\u9fa5a-zA-Z]/g, '');
      const cleanTarget = target.replace(/[^\u4e00-\u9fa5a-zA-Z]/g, '');

      const targetSyllables = getPinyinSyllableArray(cleanTarget);
      const heardSyllables = getPinyinSyllableArray(cleanHeard);

      if (!targetSyllables.length || !heardSyllables.length) return false;

      const normTarget = targetSyllables.map(normalizeSyllable);
      const normHeard = heardSyllables.map(normalizeSyllable);

      const tLen = normTarget.length;
      const hLen = normHeard.length;

      if (hLen < tLen) return false;

      for (let i = 0; i <= hLen - tLen; i++) {
        let isMatch = true;
        for (let j = 0; j < tLen; j++) {
          if (normHeard[i + j] !== normTarget[j]) {
            isMatch = false;
            break;
          }
        }
        if (isMatch) return true;
      }

      return false;
    }

    function handleSuccess() {
      comboCount++;
      if (comboCount > maxCombo) maxCombo = comboCount;

      const petState = getPetState(currentIndex);
      const isUltimate = petState.isUltimate;
      const isCrit = comboCount >= 3;

      playSuccessChime(isUltimate, isCrit);
      triggerConfetti(isUltimate, isCrit);

      document.getElementById('flashcard').className = isCrit ? 'flashcard critical correct' : 'flashcard correct';

      if (isUltimate) {
        const critBox = document.getElementById('crit-box');
        critBox.innerHTML = `<div class="crit-popup">👑 神獸終極進化成功！</div>`;
        document.getElementById('status-text').innerText = `✨ 太震撼了！${petState.petName}成功終極進化！解鎖全新家園！`;
      } else if (isCrit) {
        const critBox = document.getElementById('crit-box');
        critBox.innerHTML = `<div class="crit-popup">❤️ COMBO x${comboCount} 愛心暴擊！</div>`;
        document.getElementById('status-text').innerText = `❤️ 觸發愛心暴擊！小寵物非常喜歡這個果實！`;
      } else {
        document.getElementById('status-text').innerText = `🍎 餵養成功！小寵物獲得了能量！`;
      }

      currentIndex++;
      if (recognition) {
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }

      setTimeout(() => {
        if (isChallenging) {
          document.getElementById('crit-box').innerHTML = '';
          updateCard();
          initSpeechRecognition();
        }
      }, isUltimate ? 500 : 180);
    }

    function handleFailPrompt(targetWord, heardText) {
      playFailBuzz();
      comboCount = 0;
      document.getElementById('flashcard').className = 'flashcard wrong';
      
      sessionWrongWords.add(targetWord);

      if (recognition) {
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }

      document.getElementById('modal-word').innerText = targetWord;
      document.getElementById('modal-pinyin').innerText = `[ ${getStandardPinyin(targetWord)} ]`;
      document.getElementById('modal-heard').innerText = heardText ? `(剛才聽到的發音是："${heardText}")` : '(未檢測到清晰發音)';
      document.getElementById('fail-modal').style.display = 'flex';
    }

    function choiceContinue() {
      document.getElementById('fail-modal').style.display = 'none';
      document.getElementById('flashcard').className = 'flashcard';
      initSpeechRecognition();
    }

    function choiceRestart() {
      document.getElementById('fail-modal').style.display = 'none';
      startNewGame();
    }

    function choiceEnd() {
      document.getElementById('fail-modal').style.display = 'none';
      showFinalSummary();
    }

    function skipWord() {
      if (!isChallenging) return;
      comboCount = 0;
      if (recognition) {
        recognition.onend = null;
        try { recognition.stop(); } catch(e) {}
      }
      currentIndex++;
      updateCard();
      initSpeechRecognition();
    }

    function showFinalSummary() {
      stopChallenge();

      const count = currentIndex;
      const currentMax = loadHighScore();
      let isNewRecord = false;

      if (count > currentMax) {
        localStorage.setItem('vocab_challenge_max', count);
        loadHighScore();
        isNewRecord = true;
      }

      const resultBox = document.getElementById('result-box');
      const resultTitle = document.getElementById('result-title');
      const resultInfo = document.getElementById('result-info');

      resultTitle.innerText = isNewRecord ? "🎉 恭喜刷新最高養成紀錄！" : "🎯 萌寵養成成果日誌";
      
      let wrongWordsHTML = "";
      if (sessionWrongWords.size > 0) {
        wrongWordsHTML = `
          <div style="margin-top: 15px; text-align: left;">
            <div style="font-weight: bold; color: #f43f5e; font-size: 16px;">❌ 本次待教導複習的詞語（錯題集）：</div>
            <div class="wrong-words-grid">
              ${Array.from(sessionWrongWords).map(w => `<div class="wrong-tag"><b>${w}</b> <span style="font-size:13px; color:#a0aec0;">(${getStandardPinyin(w)})</span></div>`).join('')}
            </div>
          </div>
        `;
      } else {
        wrongWordsHTML = `<div style="margin-top: 10px; color: #34d399; font-weight: bold;">🌟 太棒了！本次養成全程完美零失誤！</div>`;
      }

      resultInfo.innerHTML = `
        🍎 本次共成功餵養 <b>${count}</b> 個果實！<br>
        👑 解鎖最高家園：<b>${stageThemes[getPetState(count).themeIdx].name}</b><br>
        ❤️ 最高愛心連擊：<b>${maxCombo} Combo</b>！<br>
        ${isNewRecord ? "🌟 成功創下新的個人最高養成紀錄！" : "繼續加油，孵化更多奇幻神獸！"}
        ${wrongWordsHTML}
      `;
      resultBox.style.display = 'block';
    }

    function endChallenge(isWin) {
      stopChallenge();
      const count = currentIndex;
      localStorage.setItem('vocab_challenge_max', activeWordList.length);
      loadHighScore();

      const resultBox = document.getElementById('result-box');
      const resultTitle = document.getElementById('result-title');
      const resultInfo = document.getElementById('result-info');

      resultTitle.innerText = "🎉 恭喜成為大滿貫萌寵大師！";
      resultInfo.innerHTML = `📚 太震撼了！你成功收集並養大了全部 <b>${count}</b> 個詞語的神獸！`;
      resultBox.style.display = 'block';
    }

    loadHighScore();
    const savedListStr = localStorage.getItem('vocab_saved_list');
    if (savedListStr) {
      try { activeWordList = JSON.parse(savedListStr); } catch(e) {}
    }
    currentMode = localStorage.getItem('vocab_saved_mode') || 'sequential';
    selectMode(currentMode);
  </script>
</body>
</html>
